[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation"
version = "0.1.0"
description = "Core building blocks for services, storage, and utilities."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "filelock",
    "platformdirs",
    "rich",
]

[project.optional-dependencies]
scraping = [
    "bs4>=0.0.2",
    "html5lib",
    "markdownify>=1.2.3",
    "readability-lxml>=0.8.4.1",
    "trafilatura>=2.1.0",
]

# # Not needed
# [tool.setuptools]
# package-dir = { "foundation" = "foundation" }
# packages = ["foundation"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.16.1",
    "pre-commit>=4.6.0",
]
